name: Edição diária

on:
  schedule:
    - cron: "47 10 * * *"   # 07:47 no horário de Brasília
  workflow_dispatch:          # permite rodar na mão pela aba Actions

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Gerar notícias e análises do dia
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/gerar.py
      - name: Salvar no repositório
        run: |
          git config user.name "Mapa do Bolso"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Edição de $(date +%Y-%m-%d)"
          git push
