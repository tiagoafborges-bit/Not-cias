<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="As notícias do mundo que mexem com o seu bolso, explicadas em um minuto.">
<title>Mapa do Bolso</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Public+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="pagina">
  <header class="topo">
    <h1 class="marca">Mapa do Bolso</h1>
    <span id="data"></span>
  </header>

  <section class="lead">
    <h2 id="manchete">Carregando a edição de hoje…</h2>
    <p id="linha-fina"></p>
    <p id="agenda"></p>
  </section>

  <main class="palco">
    <svg id="mapa" role="img" aria-label="Mapa-múndi com os países das notícias de hoje. Clique num país para ler o fato."></svg>
    <div class="zoom">
      <button type="button" id="zoom-mais" aria-label="Aproximar">+</button>
      <button type="button" id="zoom-menos" aria-label="Afastar">−</button>
      <button type="button" id="zoom-reset" aria-label="Ver o mundo inteiro">↺</button>
    </div>
    <div class="balao" id="balao" role="dialog" aria-labelledby="balao-titulo" hidden></div>
  </main>

  <p class="aviso">Conteúdo informativo, produzido com apoio de IA a partir de notícias públicas. Não é recomendação de investimento.</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script src="app.js"></script>
</body>
</html>
